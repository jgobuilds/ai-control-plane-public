# Project name pinned EXPLICITLY. Without this, Compose derives it from the
# FOLDER, so renaming the directory silently creates new empty volumes and
# orphans the n8n database and CLI auth. Learned the hard way — see the
# rename runbook in docs/.
name: ai-control-plane

services:
  # Locked-down sidecar: runs the Claude Code CLI on your SUBSCRIPTION auth,
  # exposed only on the internal docker network (no host port published).
  claude-runner:
    # POOL MODE ONLY — not started by a plain `docker compose up`.
    #
    # This container mounts the WHOLE workspace. That is correct for pool mode
    # (RUNNER_MAP=off, no scoped runners) and is precisely finding C1 when the
    # scoped runners exist: an idle container with total visibility, sitting on
    # agentnet, reachable by anything holding RUNNER_TOKEN. Scoping the other
    # runners while leaving this one running would make the isolation claim
    # cosmetic — the data is still one HTTP call away, just not via the router.
    #
    # A profile keeps it defined without running it. `docker compose run --rm
    # claude-runner claude login` and `docker compose up -d claude-runner` both
    # still work, because Compose enables a profile when the service is named
    # explicitly — which is how scripts/smoke_test.sh starts it.
    profiles: ["pool"]
    # Resource ceiling (threat-model M7). Sized to stop a runaway, not
    # to bin-pack: measured idle use is orders of magnitude below this.
    # memswap_limit == mem_limit, else the container escapes into host swap.
    mem_limit: 3g
    memswap_limit: 3g
    cpus: "2.0"
    pids_limit: 512
    build: ./claude-runner
    container_name: claude-runner
    restart: unless-stopped
    cap_add:
      - NET_ADMIN                 # required so init-firewall.sh can set iptables
    environment:
      - RUNNER_TOKEN=${RUNNER_TOKEN:?set RUNNER_TOKEN in .env}  # required; fail-closed
      - FIREWALL=on                    # set to "off" to disable egress allowlist
      # Claude subscription auth: a long-lived token from `claude setup-token`
      # (headless-friendly; avoids the in-container OAuth-callback trap). Kept in
      # gitignored .env, never committed. Leave blank to fall back to a mounted
      # ~/.claude login in the claude-config volume.
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      - DEFAULT_MAX_TURNS=${DEFAULT_MAX_TURNS:-40}
      - FANOUT_CONCURRENCY=${FANOUT_CONCURRENCY:-4}   # parallel worktree agents
      # Optional: enable n8n-mcp's create/update/execute tools. Leave blank to
      # run in docs+validation-only mode (still fixes config hallucination).
      - N8N_API_URL=${N8N_API_URL:-}
      - N8N_API_KEY=${N8N_API_KEY:-}
      # ask-human: where the agent raises a question mid-run. Reaches n8n
      # over tcp/5678 on the docker network — a hole init-firewall.sh
      # already opens for n8n-mcp, so this needed no new egress.
      - ASK_HUMAN_URL=${ASK_HUMAN_URL:-http://n8n:5678/webhook/ask-human}
      # Presented to that webhook. A secret of its own, NOT RUNNER_TOKEN, so n8n
      # can verify the runner without holding a credential any runner accepts
      # (threat-model C3).
      - ASK_HUMAN_TOKEN=${ASK_HUMAN_TOKEN:?set a DISTINCT ASK_HUMAN_TOKEN in .env}
    volumes:
      # HOME is /home/node (entrypoint sets it). The auth volume only covered
      # /home/node/.claude, so `/home/node/.claude.json` — config and session
      # state the CLI writes beside it — was lost on every recreate. Proven by
      # planting a marker in each and recreating: the one inside the volume
      # survived, the one beside it did not. claude-home persists the whole home;
      # claude-config stays nested on top: scripts/status_data.py reads the
      # runner's Claude Code transcripts from that volume for the status page.
      - claude-home:/home/node             # whole home, so nothing auth-related escapes
      - claude-config:/home/node/.claude   # persists your `claude auth login` token
      - ./workspace:/workspace             # CLAUDE.md + workflow JSON exports (Git this)
      - ./generated:/generated:ro          # MCPs/CLIs built by the capability factory
    networks:
      - agentnet
    # NOTE: intentionally NO `ports:` — nothing on this container is reachable
    # from the host or the internet, only from other containers on agentnet.

  # Second agent, same contract. Provider-flagged (gemini today; swap the build
  # args to Antigravity or another headless CLI). Rides Gemini's Google-login
  # free tier — same "no API rate" theme as the Claude subscription.
  gemini-runner:
    # POOL MODE ONLY — see claude-runner above. Same whole-workspace mount, same
    # reasoning. This one mattered more: gemini is `t1`, the cheapest tier, so
    # the least isolated container was carrying the most traffic. Scoped mode
    # now routes that traffic to `gemini-runner-commons`, which mounts only the
    # pooled subtree.
    profiles: ["pool"]
    # Resource ceiling (threat-model M7). Sized to stop a runaway, not
    # to bin-pack: measured idle use is orders of magnitude below this.
    # memswap_limit == mem_limit, else the container escapes into host swap.
    mem_limit: 3g
    memswap_limit: 3g
    cpus: "2.0"
    pids_limit: 512
    build:
      context: ./gemini-runner
      # To swap providers, override these (and the login step in the README):
      # args: { AGENT_NPM: "<npm-pkg>", AGENT_BIN: "<binary>" }
    container_name: gemini-runner
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    environment:
      - RUNNER_TOKEN=${RUNNER_TOKEN:?set RUNNER_TOKEN in .env}
      - FIREWALL=on
      - PROVIDER=gemini
      # Gemini auth, same pattern as CLAUDE_CODE_OAUTH_TOKEN: a free-tier AI
      # Studio key (aistudio.google.com/apikey) in gitignored .env. Headless —
      # avoids the in-container OAuth-callback trap — and stays on the free tier
      # rather than metered billing. The CLI reads it from the env it inherits;
      # generativelanguage.googleapis.com is already in the egress allowlist.
      # Leave blank to fall back to a mounted Google login in gemini-config.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # Provider-flag knobs (one-line swap to Antigravity, etc.):
      - AGENT_BIN=${AGENT_BIN:-gemini}
      - PROMPT_FLAG=${PROMPT_FLAG:--p}
      - EXTRA_ARGS=${GEMINI_EXTRA_ARGS:---yolo --output-format json}
      - READONLY_ARGS=${GEMINI_READONLY_ARGS:-}   # unset = a tool-narrowed request is refused; see gemini-runner/server.js
    volumes:
      - gemini-home:/home/node             # see claude-runner: HOME-level persistence
      - gemini-config:/home/node/.gemini   # persists the Gemini/Google login
      - ./workspace:/workspace
    networks:
      - agentnet

  # Cost-tiering router: the single policy-enforcing entry point. n8n calls this,
  # not the runners directly. Deterministic-first, cheapest-capable model, hard
  # maxTier ceiling, optional cross-provider verify. Internal only.
  router:
    # Resource ceiling (threat-model M7). Sized to stop a runaway, not
    # to bin-pack: measured idle use is orders of magnitude below this.
    # memswap_limit == mem_limit, else the container escapes into host swap.
    mem_limit: 1g
    memswap_limit: 1g
    cpus: "1.0"
    pids_limit: 256
    build: ./router
    container_name: router
    restart: unless-stopped
    # Defence in depth: already non-root, and needs no Linux capabilities.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      # Read the overlay's tree, not the engine's sample.
      - SCOPES_PATH=/instance/context/scopes.json
      # Which map, explicitly. The router's fallback resolves relative to its
      # own file, which in the image is the ENGINE'S SAMPLE map — correct for a
      # sample deployment and wrong here, and the two look identical at a glance.
      - RUNNER_MAP_PATH=/instance/generated/context/runner-map.json
      # CUTOVER (ISOLATION-FIX-PLAN step 5). Every scope now routes to its own
      # root's runner instead of a shared one with a cwd. Off is the rollback:
      # set RUNNER_MAP=off and recreate the router — one variable, no redeploy
      # of anything else.
      - RUNNER_MAP=${RUNNER_MAP:-on}
      - RUNNER_TOKEN=${RUNNER_TOKEN:?set RUNNER_TOKEN in .env}   # to call the runners
      - ROUTER_TOKEN=${ROUTER_TOKEN:?set a DISTINCT ROUTER_TOKEN in .env}  # n8n -> router
      - CONTROL_DIR=/control                                     # kill switch state dir (control/halt.json)
    volumes:
      - ./context:/app/context:ro                    # engine defaults (SAMPLE scope tree)
      # The REAL scope tree, from the private overlay, READ-ONLY. `${VAR:?}` and
      # not a literal path: the overlay's directory name is an org identity token
      # the public-hygiene gate blocks, and this file ships in the public
      # snapshot. Fail-closed like the tokens — refuse to start rather than fall
      # back to the sample tree, which would look identical while routing real
      # work through fictional scopes.
      - ${AICP_INSTANCE:?set AICP_INSTANCE in .env — path to the private overlay}/context:/instance/context:ro
      # The GENERATED runner map, from the same overlay. It is derived from the
      # real tree, so it lives with the tree and never in the engine.
      - ${AICP_INSTANCE:?set AICP_INSTANCE in .env — path to the private overlay}/generated:/instance/generated:ro
      - ./audit:/audit                               # tamper-evident decision ledger
      - ./control:/control                           # kill switch + circuit-breaker state (halt.json)
    networks:
      - agentnet
    # No depends_on. The router reaches runners over the network by name, and in
    # scoped mode those names are GENERATED (claude-runner-commons,
    # gemini-runner-commons, one per root) — a hardcoded edge to the pool-mode
    # runners would name containers that scoped mode never starts, and Compose
    # rejects the whole project rather than skipping the edge. It also bought
    # nothing: depends_on waits for the container to exist, not for the process
    # to be ready, so the router's retry path was always the real mechanism.

  # PII scrubber + ingest gateway. Drive content enters the workspace ONLY
  # through this container. /vault (token maps) is mounted here and NOWHERE
  # else — runners see tokens, never values. Internal network only; no egress.
  scrubber:
    # Resource ceiling (threat-model M7). Sized to stop a runaway, not
    # to bin-pack: measured idle use is orders of magnitude below this.
    # memswap_limit == mem_limit, else the container escapes into host swap.
    mem_limit: 1g
    memswap_limit: 1g
    cpus: "1.0"
    pids_limit: 256
    build: ./scrubber
    container_name: scrubber
    restart: unless-stopped
    # HARDENING — this service holds the PII token vault, so it is the worst place
    # in the stack to run privileged. It cannot be made non-root here: the bind
    # mounts live on a Windows drive exposed to WSL via 9p/drvfs with uid=0;gid=0
    # synthesized and no metadata option, so everything reads as root:root and
    # `chown` is silently a no-op. USER node would leave it unable to write the
    # vault. (Verified 2026-07-25, not assumed.)
    #
    # So instead of pretending the uid can change, take away what root can DO:
    # drop every Linux capability and forbid privilege escalation. It is a plain
    # HTTP service that reads and writes mounted files — it needs none of them.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - SCRUBBER_TOKEN=${SCRUBBER_TOKEN:?set a DISTINCT SCRUBBER_TOKEN in .env}
    volumes:
      - ./workspace:/workspace
      - ./vault:/vault                # PII token maps — NEVER mount into a runner
      - ./context:/app/context:ro     # scope registry
    networks:
      - agentnet

  # Python lane-runner. n8n's image is hardened with no package manager and no
  # python (docs/decisions/0006), so n8n DRIVES the python lanes over HTTP instead
  # of shelling out to them: schedule, execution log, IF gate and Notify all stay
  # in n8n. Internal to agentnet — deliberately NO published host port.
  lanes:
    # Resource ceiling (threat-model M7). Sized to stop a runaway, not
    # to bin-pack: measured idle use is orders of magnitude below this.
    # memswap_limit == mem_limit, else the container escapes into host swap.
    mem_limit: 2g
    memswap_limit: 2g
    cpus: "2.0"
    pids_limit: 512
    build:
      context: ./lanes
    image: ai-control-plane-lanes:latest
    container_name: lanes
    restart: unless-stopped
    # Defence in depth: already non-root, and needs no Linux capabilities.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - LANES_TOKEN=${LANES_TOKEN:-}          # fail-closed: unset => refuses to start
      - ALLOW_NO_AUTH=${ALLOW_NO_AUTH:-}
      # Answering an agent's question IN SLACK. A bot token is required and the
      # notification webhook cannot substitute: it is send-only and does not
      # return a message ts, so there is no thread to watch. Unset simply means
      # the n8n form stays the only answer path — Slack is an enhancement, and
      # its absence must never break the primary one.
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
      - SLACK_CHANNEL_ID=${SLACK_CHANNEL_ID:-}
      # To hand the answer back through the chokepoint rather than straight to a
      # runner — same reason n8n does.
      - ROUTER_URL=${ROUTER_URL:-http://router:8080}
      - ROUTER_TOKEN=${ROUTER_TOKEN:?set a DISTINCT ROUTER_TOKEN in .env}
      # recurrence.py derives both paths from its own location (/app/scripts),
      # which would put them at /app/audit — where nothing is mounted. The audit
      # volume lands at /audit here, so both are stated rather than inferred.
      - AICP_AUDIT_LOG=/audit/decisions.jsonl
      - AICP_RECURRENCE_LOG=/audit/recurrence.jsonl
    volumes:
      # Read-only, and deliberately narrow — only what a lane actually needs, so
      # .env and the rest of the repo stay out of this container entirely.
      #
      # The PII token vault is DELIBERATELY NOT mounted here. "The vault never
      # leaves the scrubber" is a property worth keeping, so the retention lane
      # reports on files only and states plainly that vault pruning was not
      # inspected — an honest partial, never mistaken for "nothing to prune".
      - ./scripts:/app/scripts:ro
      - ./audit:/audit:ro
      - ./context:/app/context:ro
      - ./workspace:/app/workspace:ro
      # The recurrence register. RO like everything else: the review lane reports
      # what the register says and never edits it — a disposition is a human
      # decision, and a lane that could rewrite one could close its own findings.
      - ./reliability:/app/reliability:ro
      # The router's policy, so scripts/dispatch.py builds a /route body from the
      # verbs, triggers and task types the router actually defines, instead of a
      # second copy that drifts. RO, and no secrets live in it.
      - ./router/policy.json:/app/router/policy.json:ro
    networks:
      - agentnet

  n8n:
    # Resource ceiling (threat-model M7). Sized to stop a runaway, not
    # to bin-pack: measured idle use is orders of magnitude below this.
    # memswap_limit == mem_limit, else the container escapes into host swap.
    mem_limit: 2g
    memswap_limit: 2g
    cpus: "2.0"
    pids_limit: 512
    # NOTE: n8nio/n8n is a Docker Hardened Image (Alpine, package manager REMOVED)
    # and ships no python. The scheduled Python lanes therefore run in the `lanes`
    # service above and are driven by n8n over HTTP. See docs/decisions/0006.
    #
    # EXPECTED BOOT WARNING: "Failed to start Python task runner in internal mode.
    # because Python 3 is missing from this system." n8n 2.36.9 checks for python
    # unconditionally when it starts its internal runners
    # (dist/task-runners/task-runner-module.js, startInternalTaskRunners) and, when
    # it is absent, logs this and marks the python runner unavailable. No setting
    # skips the check. The only consequence is that a Python Code node would fail
    # at RUN time, so scripts/workflow_lint.py refuses any workflow containing one.
    image: n8nio/n8n:2.36.9@sha256:a9e2e3c8006ed453238266669ea1274be7136f515abe290a2f75a0ab9044c93d  # pinned 2026-08-31 (tag named 2026-09-17), see context/image-policy.json
    container_name: n8n
    restart: unless-stopped
    ports:
      # Bound to localhost ONLY — not reachable from the LAN. Put SSO/IAP or a
      # reverse proxy in front for remote access (see GSUITE-GCP.md).
      - "127.0.0.1:5678:5678"     # n8n UI at http://localhost:5678
      - "[::1]:5678:5678"         # localhost resolves to ::1 first on Windows;
                                  # a 127.0.0.1-only publish HANGS rather than refusing
    environment:
      - N8N_SECURE_COOKIE=false
      - GENERIC_TIMEZONE=America/New_York
      # SECURITY: complete n8n owner-account setup on first launch (user
      # management) — a localhost bind stops the LAN, not a local user.
      # ENV ACCESS IN NODES IS ON, AND THE AUTH TOKENS BELOW ARE READABLE BY ANY
      # expression or Code node. This comment used to say the tokens lived in
      # workflow node params; they moved to $env as the lanes grew. What n8n
      # holds is therefore what anyone who can author a workflow here holds:
      # LANES_TOKEN (lanes), ROUTER_TOKEN (the router, which is the intended
      # door) and ASK_HUMAN_TOKEN (verifying its own webhook). It must NEVER hold
      # RUNNER_TOKEN: that is the runners' inbound credential, and holding it let a
      # workflow authored in the UI skip the router (threat-model C3). Enforced
      # by tests/security_test.py and the HOLDING rule in boundary_check.py.
      # Treat every value here as a secret.
      # Allow $env access in expressions so the Notify sub-workflow can read the
      # channel selection and webhook URLs below.
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      # --- Notification seam: pick ONE channel, set its URL. See n8n-workflows/. ---
      - NOTIFY_CHANNEL=${NOTIFY_CHANNEL:-webhook}   # slack | teams | webhook
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - TEAMS_WEBHOOK_URL=${TEAMS_WEBHOOK_URL:-}
      - NOTIFY_WEBHOOK_URL=${NOTIFY_WEBHOOK_URL:-}
      # Read by the drive-sync / deliverables Code nodes via $env (env access in
      # nodes is enabled above). Empty until set — those lanes throw rather than
      # query a bogus folder id.
      - DRIVE_FOLDER_ID=${DRIVE_FOLDER_ID:-}
      - LANES_TOKEN=${LANES_TOKEN:-}
      # Base URL used to deep-link an alert to its own execution. Detail
      # belongs behind a link, not pasted into the channel. Default is
      # localhost, which is NOT reachable from a phone — hence the rule
      # that the message must carry the decision and the link only the
      # evidence (notification-taxonomy.md).
      - N8N_BASE_URL=${N8N_BASE_URL:-http://127.0.0.1:5678}
      # Lets a workflow call the ROUTER (http://router:8080/route) — the seam
      # where a lane hands work to an agent. Without it every n8n->router call
      # fails 401, which is exactly what happened: the token reached `lanes` but
      # was never passed to `n8n`, so no workflow could route to an agent at all.
      # Only surfaced by running a lane end to end. Deployed is not run.
      - ROUTER_TOKEN=${ROUTER_TOKEN:?set a DISTINCT ROUTER_TOKEN in .env}
      # Authenticates the runner's ask-human webhook. That endpoint can block a
      # run and page a human, so it must not be open to anything that reaches the
      # docker network. It used to reuse RUNNER_TOKEN "to add no new secret", and
      # that reuse is what put the runners' credential inside n8n. A distinct
      # secret costs one line in .env.
      - ASK_HUMAN_TOKEN=${ASK_HUMAN_TOKEN:?set a DISTINCT ASK_HUMAN_TOKEN in .env}
    volumes:
      - n8n-data:/home/node/.n8n
    networks:
      - agentnet
    depends_on:
      # The router and lanes only. n8n calls the ROUTER, not the runners — that
      # is the chokepoint invariant this repo is built on — so a dependency edge
      # from n8n to a runner asserted a relationship the architecture forbids.
      # It also broke scoped mode outright once the pool runners moved behind a
      # profile.
      - router
      - lanes

  # Capability factory (PRIVILEGED LANE — on-demand only, not started by default).
  # Runs cli-printing-press to generate new CLIs + MCP servers when the runner
  # lacks an integration. Deliberately NOT firewalled: the research phase sniffs
  # arbitrary APIs/sites. Start it explicitly and supervise it:
  #   docker compose --profile builder run --rm claude-builder
  # Output lands in ./generated, which the runner mounts read-only.
  claude-builder:
    # Resource ceiling (threat-model M7). Sized to stop a runaway, not
    # to bin-pack: measured idle use is orders of magnitude below this.
    # memswap_limit == mem_limit, else the container escapes into host swap.
    mem_limit: 4g
    memswap_limit: 4g
    cpus: "4.0"
    pids_limit: 1024
    build:
      context: ./capability-factory
      dockerfile: Dockerfile.builder
    container_name: claude-builder
    profiles: ["builder"]        # excluded from `docker compose up` unless requested
    stdin_open: true
    tty: true
    volumes:
      - claude-home:/home/node             # same home-level persistence as the runner
      - claude-config:/home/node/.claude   # reuse the same subscription login
      - ./generated:/generated             # writable output
      - ./workspace:/workspace
    networks:
      - agentnet

volumes:
  claude-home:
  gemini-home:
  claude-config:
  gemini-config:
  n8n-data:

networks:
  agentnet:
