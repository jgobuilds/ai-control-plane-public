# Framework-coverage map — the control plane controls -> recognized AI-governance frameworks
#
# HAND-AUTHORED source of truth. `scripts/gen_compliance_map.py` reads this file
# and emits docs/compliance-map.md (three matrices + coverage summary + gaps).
# `tests/compliance_test.py` validates it is well-formed and that every referenced
# the control plane control name matches a real control row in GOVERNANCE.md.
#
# Each mapping entry: control (a GOVERNANCE.md control name, or "-" for a pure gap)
#   -> framework -> requirement satisfied -> how (1 line) -> coverage.
# coverage is one of: full | partial | none. Be HONEST — partial/none where
# the control plane genuinely does not cover something.
#
# Framework names are cited nominatively; requirement text is summarized in our
# own words (NOT reproduced verbatim). Where a framework's numbering/wording
# varies by version, the version/date used is recorded in `frameworks` below.

meta:
  generated_by: "scripts/gen_compliance_map.py"
  source_of_truth: "compliance/framework-map.yaml"
  control_catalog: "GOVERNANCE.md (control-catalog table)"
  coverage_values: [full, partial, none]

frameworks:
  owasp_agentic:
    name: "OWASP Agentic AI — Threats & Mitigations"
    short: "OWASP Agentic Top 10"
    version_note: >-
      Threat categories (T1..T15) follow the OWASP GenAI Security Project
      "Agentic AI — Threats and Mitigations" guide (v1.0, Feb 2025) and the
      related OWASP Agentic threat taxonomy circulated through 2026. OWASP has
      not published a fixed, officially numbered "Top 10 for Agentic AI" the way
      it has for LLM applications; numbering therefore varies by draft. We label
      every entry with a short threat NAME (numbers are indicative only) and map
      the threats most relevant to the control plane. Verified against the taxonomy as
      of 2026-07-18.
  nist_ai_rmf:
    name: "NIST AI Risk Management Framework (AI RMF 1.0)"
    short: "NIST AI RMF"
    version_note: >-
      Organized by the four AI RMF functions — Govern, Map, Measure, Manage
      (NIST AI 100-1, Jan 2023, plus the Generative AI Profile NIST-AI-600-1,
      Jul 2024). Sub-requirements are summarized in our own words, not quoted.
      Reviewed 2026-07-18.
  eu_ai_act:
    name: "EU Artificial Intelligence Act (Regulation (EU) 2024/1689)"
    short: "EU AI Act"
    version_note: >-
      High-risk-system obligations, Chapter III Section 2 (Articles 9-15) plus
      post-market monitoring / serious-incident reporting (Articles 72-73).
      Article numbers per the OJ text published 2024-07-12. Requirements are
      paraphrased, not reproduced. Applicability depends on the deployer's own
      risk classification; this map treats the obligations as a control
      checklist, not a legal determination. Reviewed 2026-07-18.

# Canonical control list — MUST mirror the GOVERNANCE.md control-catalog rows.
# The test cross-checks each `name` against the names parsed from GOVERNANCE.md.
controls:
  - { id: "0",  name: "Kill switch + circuit breaker" }
  - { id: "1",  name: "Context scope" }
  - { id: "2",  name: "Ethical walls" }
  - { id: "3",  name: "PII" }
  - { id: "3a", name: "Injection/output guardrails" }
  - { id: "3b", name: "Tool allowlisting" }
  - { id: "4",  name: "Risk" }
  - { id: "5",  name: "Operating mode" }
  - { id: "6",  name: "Cost tier" }
  - { id: "7",  name: "Human gates" }
  - { id: "7a", name: "Approver RBAC + SoD" }
  - { id: "8",  name: "Audit ledger" }
  - { id: "9",  name: "Retention & deletion" }
  - { id: "10", name: "AI use-case register" }
  - { id: "11", name: "Framework-coverage map" }  # this artifact itself (meta-control; no self-mapping)
  - { id: "12", name: "Eval / drift lane" }
  - { id: "13", name: "Quality regression / improvement loop" }
  - { id: "14", name: "Container resource ceilings" }

# ---------------------------------------------------------------------------
# MAPPINGS
# ---------------------------------------------------------------------------
mappings:

  # ===================== OWASP Agentic AI threats =====================
  - control: "Context scope"
    framework: owasp_agentic
    requirement: "T1 Memory Poisoning"
    how: "Agent sees only its own scope + ancestors; siblings are not mounted, so poisoned memory cannot cross scopes (silo mode)."
    coverage: partial
  - control: "Retention & deletion"
    framework: owasp_agentic
    requirement: "T1 Memory Poisoning"
    how: "Ingest/deliverable files age out on retentionDays; offboarding purges a scope's subtree + vault, limiting persistence of poisoned context."
    coverage: partial
  - control: "Injection/output guardrails"
    framework: owasp_agentic
    requirement: "T1 Memory Poisoning"
    how: "Heuristic inputScan flags injection shapes in ingested content before it reaches the agent."
    coverage: partial

  - control: "Tool allowlisting"
    framework: owasp_agentic
    requirement: "T2 Tool Misuse"
    how: "Per-scope allowedTools is enforced in the runner with --tools (built-ins) and --disallowedTools mcp__<server> (MCP). Until 2026-09-17 it went to --allowedTools, which restricts nothing under --dangerously-skip-permissions, so this was rated full while enforcing nothing (threat-model H5). Partial: only scopes that declare a list are narrowed, and binding each request's tools to its declared action is not yet on."
    coverage: partial
  - control: "Human gates"
    framework: owasp_agentic
    requirement: "T2 Tool Misuse"
    how: "Irreversible tool actions (ship/promote/apply) require a human approval before dispatch."
    coverage: partial
  - control: "Risk"
    framework: owasp_agentic
    requirement: "T2 Tool Misuse"
    how: "High-blast-radius actions (apply/send/execute) trigger requireApproval/requireVerify proportionally."
    coverage: partial

  - control: "Context scope"
    framework: owasp_agentic
    requirement: "T3 Privilege Compromise"
    how: "Structural OS-mount isolation (silo) means a low-trust scope cannot read a higher-trust one even under --dangerously-skip-permissions."
    coverage: partial
  - control: "Ethical walls"
    framework: owasp_agentic
    requirement: "T3 Privilege Compromise"
    how: "Conflicting scopes never share a runner (conformance-tested), preventing lateral privilege reuse across tenants."
    coverage: full
  - control: "Approver RBAC + SoD"
    framework: owasp_agentic
    requirement: "T3 Privilege Compromise"
    how: "Approver must belong to an authorized identity group for the risk level/scope; approver != requester at high/critical."
    coverage: partial

  - control: "Kill switch + circuit breaker"
    framework: owasp_agentic
    requirement: "T4 Resource Overload"
    how: "Sliding-window rate/budget breaker refuses new requests once a per-scope/global ceiling is met, halting runaway loops."
    coverage: partial

  - control: "Container resource ceilings"
    framework: owasp_agentic
    requirement: "T4 Resource Overload"
    how: >-
      Every service and every per-tenant silo runner declares mem_limit,
      memswap_limit, cpus and pids_limit, enforced by the kernel and verified on
      the running containers rather than only in YAML. pids_limit is the control
      that closes the fork-bomb case; memswap_limit equals mem_limit so a
      container at its ceiling cannot escape into host swap. Complements the
      breaker, which bounds request RATE but cannot stop one request exhausting
      the host. Asserted per service across both compose files by
      tests/security_test.py.
    coverage: full

  - control: "-"
    framework: owasp_agentic
    requirement: "T5 Unsafe / unmoderated content generation"
    how: >-
      SCOPED OUT deliberately — see gap G9. No moderation classifier exists. The
      injection half of this requirement is covered by inputScan and the
      instruction-hierarchy rule; the generated-content half does not arise while
      every outward path passes a human gate. Recorded as a decision with a
      revisit trigger rather than left as a silent absence.
    coverage: none

  - control: "Risk"
    framework: owasp_agentic
    requirement: "T5 Cascading Hallucination"
    how: "requireVerify forces a fresh-context verifier pass when access/autonomy >= 2, catching propagated errors before action."
    coverage: partial
  - control: "Operating mode"
    framework: owasp_agentic
    requirement: "T5 Cascading Hallucination"
    how: "ai-led scopes stamp requiresOutputValidation so a human validates output before it becomes authoritative."
    coverage: partial

  - control: "Injection/output guardrails"
    framework: owasp_agentic
    requirement: "T6 Intent Breaking & Goal Manipulation"
    how: "inputScan warns/blocks on injection shapes; ingested/event content is treated as data, not instructions."
    coverage: partial
  - control: "Context scope"
    framework: owasp_agentic
    requirement: "T6 Intent Breaking & Goal Manipulation"
    how: "Containment limits what a manipulated agent can reach even if its goal is subverted."
    coverage: partial

  - control: "Operating mode"
    framework: owasp_agentic
    requirement: "T7 Misaligned & Deceptive Behaviors"
    how: "maxAction caps what the agent may do; human validates output in ai-led, human is the actor in human-led."
    coverage: partial
  - control: "Audit ledger"
    framework: owasp_agentic
    requirement: "T7 Misaligned & Deceptive Behaviors"
    how: "Every decision (verdict, risk, action) is hash-chained, so misaligned behavior is detectable after the fact."
    coverage: partial

  - control: "Audit ledger"
    framework: owasp_agentic
    requirement: "T8 Repudiation & Untraceability"
    how: "Append-only, hash-chained, PII-free decision ledger; any edit/delete/reorder breaks the chain (verify_audit.py)."
    coverage: full

  - control: "Approver RBAC + SoD"
    framework: owasp_agentic
    requirement: "T9 Identity Spoofing & Impersonation"
    how: "Named-approver identity-group check with segregation of duties on the /route path."
    coverage: partial

  - control: "Risk"
    framework: owasp_agentic
    requirement: "T10 Overwhelming Human-in-the-Loop"
    how: "Proportional controls gate only high-access/high-autonomy requests, so humans are not flooded with trivial approvals."
    coverage: partial
  - control: "Human gates"
    framework: owasp_agentic
    requirement: "T10 Overwhelming Human-in-the-Loop"
    how: "Approval timeout = deny (fail-closed), so a swamped approver cannot be pressured into a rushed yes."
    coverage: partial

  - control: "Ethical walls"
    framework: owasp_agentic
    requirement: "T13 Rogue Agents in Multi-Agent Systems"
    how: "Conflicting scopes are isolated to separate runners; no shared runner across an ethical wall."
    coverage: partial
  - control: "Kill switch + circuit breaker"
    framework: owasp_agentic
    requirement: "T13 Rogue Agents in Multi-Agent Systems"
    how: "Operator halt can stop a global scope, a specific scope, or an ancestor subtree before dispatch."
    coverage: partial

  - control: "Injection/output guardrails"
    framework: owasp_agentic
    requirement: "T15 Human Manipulation"
    how: "outputScan flags secret/exfil leakage in agent output before it reaches a human or an egress lane."
    coverage: partial

  # T12 was recorded as a pure gap until 2026-09-09, when the claim was actually
  # checked and found to be describing a channel this system does not have. Two
  # distinct paths hide under "inter-agent communication", and they have opposite
  # answers — a single `none` row asserted the wrong one:
  #   peer-to-peer   NO runner addresses another runner. Verified in the source and
  #                  enforced continuously by scripts/boundary_check.py, which fails
  #                  CI on any direct runner URL outside the router.
  #   router-mediated  REAL and in use: /route runs an executor, then a verifier
  #                  that reads the executor's output (cross-vendor on t3). That IS
  #                  agent-to-agent, so claiming the threat does not apply would be
  #                  the opposite overclaim.
  # Hence partial, not none and not full: the surface is halved structurally and the
  # remaining half is chokepointed and logged, while the residual below is real.
  - control: "Ethical walls"
    framework: owasp_agentic
    requirement: "T12 Agent Communication Poisoning"
    how: "No peer-to-peer agent channel exists to poison: no runner addresses another runner, and boundary_check.py fails CI on any direct runner URL outside the router. The only inter-agent path is router-mediated (executor -> verifier), so there is no hop between agents for a third party to interpose on."
    coverage: partial
  - control: "Audit ledger"
    framework: owasp_agentic
    requirement: "T12 Agent Communication Poisoning"
    how: "The mediated executor -> verifier exchange is a router decision, so it lands in the hash-chained ledger with verifyStatus distinguishing 'no verify ran' from 'the verifier was unreachable'. RESIDUAL: nothing cryptographically binds the executor's output to the verifier's input, and the chain is tamper-EVIDENT rather than non-repudiable until the head hash is anchored externally (see GOVERNANCE.md and the component-standards survey in idea-dossier/02-landscape.md). A compromised router defeats this, but that is a larger failure than T12."
    coverage: partial

  # ===================== NIST AI RMF =====================
  - control: "Risk"
    framework: nist_ai_rmf
    requirement: "Govern: policies, processes & accountability for AI risk"
    how: "Governance-as-code — risk/mode/RBAC policy in policy.json, enforced at one chokepoint and unit-tested (conformance_test.py)."
    coverage: full
  - control: "Operating mode"
    framework: nist_ai_rmf
    requirement: "Govern: policies, processes & accountability for AI risk"
    how: "Per-scope operating mode sets the human/AI relationship deliberately per function."
    coverage: full
  - control: "AI use-case register"
    framework: nist_ai_rmf
    requirement: "Govern: maintain an inventory of AI systems/use cases"
    how: "Derived conformity inventory of every scope's use case, owner, risk, mode, and status — cannot drift from enforcement."
    coverage: full
  - control: "Approver RBAC + SoD"
    framework: nist_ai_rmf
    requirement: "Govern: roles, responsibilities & accountability lines"
    how: "identityGroup-based approver authorization with segregation of duties; use-case register names an accountable owner."
    coverage: full
  - control: "Kill switch + circuit breaker"
    framework: nist_ai_rmf
    requirement: "Govern: mechanisms to deactivate/decommission a system safely"
    how: "Operator halt + automatic budget/rate breaker; offboarding removes a scope subtree and issues a deletion certificate."
    coverage: full
  - control: "Risk"
    framework: nist_ai_rmf
    requirement: "Govern: third-party / supply-chain (provider) risk"
    how: "blockCrossVendor keeps confidential work on a single vendor; local-first stack avoids external data processors."
    coverage: partial

  - control: "AI use-case register"
    framework: nist_ai_rmf
    requirement: "Map: establish context & categorize the AI use case"
    how: "Each scope records its use case, owner, level, and status; lanes capture cross-scope workflows."
    coverage: full
  - control: "Risk"
    framework: nist_ai_rmf
    requirement: "Map: identify & classify risks (likelihood/impact)"
    how: "data x access x autonomy scoring derives a risk level per request; escalates to critical when >=2 dimensions max out."
    coverage: full
  - control: "Context scope"
    framework: nist_ai_rmf
    requirement: "Map: characterize potential impacts & blast radius"
    how: "Scope tree + isolation define blast radius; the access dimension encodes act-vs-read impact."
    coverage: partial

  - control: "Kill switch + circuit breaker"
    framework: nist_ai_rmf
    requirement: "Measure: track effectiveness of controls & risk metrics"
    how: "Conformance tests assert governance invariants hold; audit ledger records which controls fired per decision."
    coverage: partial
  - control: "Audit ledger"
    framework: nist_ai_rmf
    requirement: "Measure: track effectiveness of controls & risk metrics"
    how: "Per-decision record of risk/verdict/controls is the measurement substrate (metadata only)."
    coverage: partial
  - control: "Injection/output guardrails"
    framework: nist_ai_rmf
    requirement: "Measure: robustness & adversarial / security testing"
    how: "Heuristic input/output scans plus a security test suite and documented threat model."
    coverage: partial
  - control: "-"
    framework: nist_ai_rmf
    requirement: "Measure: ongoing evaluation of model quality / task-adherence over time (drift)"
    how: "Not built — no continuous eval or drift monitoring (roadmap E2)."
    coverage: none
  - control: "-"
    framework: nist_ai_rmf
    requirement: "Measure: bias / fairness measurement of outputs"
    how: "Not built — no bias or fairness testing harness."
    coverage: none

  - control: "Risk"
    framework: nist_ai_rmf
    requirement: "Manage: prioritize & respond to risks (proportional treatment)"
    how: "Controls switch on per-dimension (verify/approval/isolation/no-cross-vendor) proportional to the score."
    coverage: full
  - control: "Human gates"
    framework: nist_ai_rmf
    requirement: "Manage: prioritize & respond to risks (proportional treatment)"
    how: "Human approval on ship/promote/apply; timeout = deny."
    coverage: full
  - control: "Audit ledger"
    framework: nist_ai_rmf
    requirement: "Manage: incident response, forensics & recovery"
    how: "Tamper-evident decision trail supports forensic reconstruction; kill switch halts an in-progress incident."
    coverage: partial
  - control: "-"
    framework: nist_ai_rmf
    requirement: "Manage: formal incident-reporting workflow to stakeholders/authorities"
    how: "Not built — the ledger is a forensic substrate, but there is no incident-report generation or external notification."
    coverage: none

  # ===================== EU AI Act =====================
  - control: "Risk"
    framework: eu_ai_act
    requirement: "Art 9: risk-management system across the lifecycle"
    how: "Continuous, policy-driven risk scoring at the enforcement chokepoint with proportional controls; invariants regression-tested."
    coverage: partial
  - control: "PII"
    framework: eu_ai_act
    requirement: "Art 10: data governance (quality, minimization, protection)"
    how: "PII tokenized on ingest; pii:block refuses raw PII in prompts; scope isolation limits data reach; retention ages data out."
    coverage: partial
  - control: "Context scope"
    framework: eu_ai_act
    requirement: "Art 10: data governance (quality, minimization, protection)"
