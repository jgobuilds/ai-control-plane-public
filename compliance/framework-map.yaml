  - control: "Audit ledger"
    framework: eu_ai_act
    requirement: "Art 72-73: post-market monitoring & serious-incident reporting"
    how: "Ledger provides the monitoring/forensic substrate, but there is no serious-incident report generation or reporting-to-authorities flow."
    coverage: partial
  - control: "Eval / drift lane"
    framework: nist_ai_rmf
    requirement: "Measure 2: AI performance/quality tracked and monitored over time"
    how: "Agentic-leverage + verify-pass/change-failure/block metrics computed from the audit ledger, trended with drift flags (metadata proxy, not semantic eval)."
    coverage: partial
  - control: "Eval / drift lane"
    framework: nist_ai_rmf
    requirement: "Manage 4: monitored post-deployment; drift triggers review"
    how: "Weekly eval lane emits drift WARNs to the Notify channel when key quality/risk metrics move beyond thresholds."
    coverage: partial
  - control: "Eval / drift lane"
    framework: eu_ai_act
    requirement: "Art 72: post-market monitoring of performance over the lifecycle"
    how: "Continuous metrics from the ledger provide lifecycle performance monitoring; semantic/ground-truth accuracy eval remains a gap (G1)."
    coverage: partial
  - control: "Quality regression / improvement loop"
    framework: nist_ai_rmf
    requirement: "Measure 3: mechanisms to evaluate performance and catch regressions"
    how: "Offline eval datasets replay captured production cases and grade output (exact/contains/regex/LLM-as-judge); a regression fails the run — the quality counterpart to conformance."
    coverage: partial
  - control: "Quality regression / improvement loop"
    framework: nist_ai_rmf
    requirement: "Manage 4: incidents & feedback drive continual improvement"
    how: "A flagged production failure is captured as a persistent, PII-tokenized, per-scope eval case, so the fix is proven and the failure can't silently recur (governed observability)."
    coverage: partial
  - control: "Quality regression / improvement loop"
    framework: eu_ai_act
    requirement: "Art 15: accuracy & robustness validated and monitored over the lifecycle"
    how: "Regression datasets validate agent output quality on real cases; semantic ground-truth coverage still depends on grader quality (gap G1)."
    coverage: partial

# ---------------------------------------------------------------------------
# GAPS — the honest "does NOT yet cover" list, cross-referenced to the
# MARKET-ANALYSIS.md E2/E3 roadmap and the THREAT-MODEL.md findings.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# GAPS
#
# ID NAMESPACE WARNING. These G-ids are LOCAL TO THIS FILE and are NOT the same
# as the G-ids in docs/plans/GAP-CLOSURE-PLAN.md. Eight of them collide
# numerically while meaning different things — plan-G2 is container resource
# limits, this file's G2 is not. Anything that cross-references G-ids between
# the two documents will compare unrelated items and sound certain about it.
#
# Threat-model ids (C/H/M/L) ARE a single shared namespace and may be
# cross-referenced safely; that is what `roadmap: "Threat-model M7"` does.
# ---------------------------------------------------------------------------
gaps:
  - id: G1
    title: "Continuous model evaluation, drift & task-adherence over time"
    frameworks: ["NIST Measure", "EU Art 15", "OWASP T5 (partial)"]
    roadmap: "E2 (Continuous eval + drift) — MARKET-ANALYSIS.md"
    note: "the control plane verifies governance invariants and runs a fresh-context verifier, but does not measure model output quality over time."
  - id: G2
    title: "Bias / fairness testing"
    frameworks: ["NIST Measure", "EU Art 10/15"]
    roadmap: "Not on the current E-list; backlog"
    note: "No fairness or bias-evaluation harness for agent outputs."
  - id: G3
    title: "Model cards / full technical-documentation file (e.g. EU Annex IV)"
    frameworks: ["EU Art 11", "NIST Map"]
    roadmap: "Backlog (compliance-evidence exporter)"
    note: "Use-case register + docs partially cover this; there are no per-model model cards."
  - id: G4
    title: "Serious-incident reporting to stakeholders/authorities"
    frameworks: ["EU Art 72-73", "NIST Manage"]
    roadmap: "Backlog (compliance-evidence exporter — GDPR/HIPAA/SR 11-7 packs)"
    note: "Audit ledger is a forensic substrate only; no incident-report generation or external notification workflow."
  - id: G5
    title: "ML-based injection / PII detection (heuristic + regex only today)"
    frameworks: ["OWASP T1/T6/T15", "EU Art 10/15"]
    roadmap: "E3 (ML-based injection/PII detection) — MARKET-ANALYSIS.md; threat-model M2, H3"
    note: "inputScan/outputScan are heuristic; PII detection is US-only regex (no NER, no Luhn)."
  - id: G9
    title: "Content safety / moderation classification"
    frameworks: ["OWASP T5", "NIST Manage", "EU Art 15"]
    roadmap: "SCOPED OUT — deliberate, not deferred. Revisit on the trigger below."
    note: >-
      No moderation or content-classification layer exists, and none is planned
      at the current scope. Recorded here because an UNDOCUMENTED absence reads
      to an auditor as an oversight, while a documented one is a decision they
      can agree or disagree with. The reasoning: inputs are internal engineering
      artifacts (diffs, logs, workflow JSON) authored by known parties, and the
      egress-facing risk this category usually addresses — generated content
      reaching the public — does not arise, because every outward path already
      passes a human gate. Prompt-injection defence, which is often bundled
      under this heading, IS covered separately by inputScan (control 12) and by
      the instruction-hierarchy rule in workspace/CLAUDE.md. REVISIT TRIGGER: the
      first time output reaches an end user without a human in the path, or the
      first time input originates outside the operating organisation.
  - id: G7
    title: "Authenticated approval ingress / strong approver identity"
    frameworks: ["OWASP T9", "EU Art 14"]
    roadmap: "Threat-model M5 (identity capture) — RBAC.md"
    note: "Router-side RBAC + SoD is enforced, but the approval link is still an unauthenticated bearer capability."
  - id: G8
    title: "Structural pool-mode isolation"
    frameworks: ["OWASP T1/T3/T13", "EU Art 10"]
    roadmap: "Threat-model C1 — ISOLATION-FIX-PLAN.md"
    note: "Isolation is structural in silo mode but advisory (cwd only) in pool mode until per-scope runners are cut over."
