  - control: "Injection/output guardrails"
    framework: eu_ai_act
    requirement: "Art 15: robustness & cybersecurity"
    how: "Input/output guardrails, structural isolation, fail-closed firewall, and a security test suite address adversarial robustness."
    coverage: partial
  - control: "-"
    framework: eu_ai_act
    requirement: "Art 15: accuracy metrics & declared accuracy levels"
    how: "Not built — no model accuracy measurement or declared accuracy metrics (relates to roadmap E2)."
